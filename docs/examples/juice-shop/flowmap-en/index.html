function renderFindings() {
  const un = DATA.unverified || [];
  $('#view').innerHTML = `<div class="page"><h2>${UI.tabs.findings}</h2><p class="small">${UI.findNote}</p><p class="small">${UI.driver}: ${esc(DATA.meta.driver)} · flowmap ${UI.template} ${esc(DATA.meta.template)}</p>` +
    DATA.findings.map(f => `<div class="find ${f.sev}"><h3><span class="sev">${UI.sev[f.sev]}</span>${esc(f.title)}</h3><p>${esc(f.body)}</p><p class="small">${UI.shots}: ${f.shots.map(id => link(id)).join(', ')}</p></div>`).join('') +
    `<h3 class="sub">${UI.unverified}</h3>` +
    (un.length ? `<table><thead><tr><th>${UI.colItem}</th><th>${UI.colWhy}</th></tr></thead><tbody>${un.map(u => `<tr><td>${esc(u.what)}</td><td>${esc(u.why)}</td></tr>`).join('')}</tbody></table>` : `<p class="small">${esc(DATA.meta.unverified_none)}</p>`) + '</div>';
}

function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  renderSide();
  if (tab === 'screens') { history.replaceState(null, '', '#' + cur); renderScreen(); } else if (tab === 'tasks') renderTasks(); else renderFindings();
}

function go(id, push = true) {
  if (!byId[id]) return;
  tab = 'screens';
  if (push && id !== cur) { trail.push(id); if (trail.length > 8) trail = trail.slice(-8); }
  cur = id;
  render();
  window.scrollTo({top: 0});
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-crumb],[data-tab],#back,#all');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
  if (t.id === 'back') { if (trail.length > 1) { trail.pop(); cur = trail[trail.length - 1]; render(); } return; }
  if (t.id === 'all') { showAll = t.checked; $('.shot').classList.toggle('all', showAll); return; }
  if (t.dataset.crumb) { trail = trail.slice(0, +t.dataset.crumb + 1); cur = trail[trail.length - 1]; render(); return; }
  if (t.dataset.go) { e.preventDefault(); if (t.closest('aside')) { trail = [t.dataset.go]; go(t.dataset.go, false); } else go(t.dataset.go); }
});
document.addEventListener('mouseover', e => {
  const h = e.target.closest('.hs'), r = e.target.closest('tr[data-row]');
  document.querySelectorAll('.hs.flash').forEach(x => x.classList.remove('flash'));
  if (r) { const b = document.querySelector(`.hs[data-i="${r.dataset.row}"]`); if (b) b.classList.add('flash'); }
  const tip = $('#tip');
  if (!h) { tip.style.display = 'none'; return; }
  tip.textContent = hsText(byId[cur].hotspots[+h.dataset.i]);
  tip.style.display = 'block';
});
document.addEventListener('mousemove', e => { const tip = $('#tip'); tip.style.left = Math.min(e.clientX + 12, innerWidth - 290) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (byId[id] && (id !== cur || tab !== 'screens')) go(id); });
const start = location.hash.slice(1);
if (byId[start]) { cur = start; trail = [start]; }
renderHeader();
render();
</script>
